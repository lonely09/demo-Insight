server:
  port: 8080

spring:
  config:
    import:
      - optional:nacos:ai-knowledge
  application:
    name: ai-knowledge-base
  # ================= Nacos（注册中心 + 配置中心）=================
  # 注意：Nacos 3.x 的 8080 是【控制台】端口；客户端要连的是【服务端主端口】，默认 8848
  # 另外需放通 gRPC 端口 9848（=主端口+1000）和 9849（=主端口+1001）
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:192.168.1.120:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:Qaz123123}
      config:
        namespace: ${NACOS_NAMESPACE:ba3dfbf5-f6df-40af-9652-66d05c59bcba}    # 注意：这里要填命名空间的【ID】，不是名称
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml
      discovery:
        namespace: ${NACOS_NAMESPACE:ba3dfbf5-f6df-40af-9652-66d05c59bcba}
        group: ${NACOS_GROUP:DEFAULT_GROUP}

# ================= 业务数据统计（对话式数据 Agent）=================
bi:
  # 启动时若业务数据表为空，自动造一批演示用假数据（已存在则跳过）
  seed-on-startup: true
  # 假数据覆盖的日期跨度（天），从"今天"往前推
  seed-days: 120
